<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>to do list</title>
    <style>
      .box {
        height: 100vh;
        width: 100vw;
        background-color: burlywood;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        height: 400px;
        width: 400px;
        border: 2px solid;
      }
      .input-add {
        display: flex;
        align-items: center;
        justify-content: space-around;
        height: 20%;
        border: 2px solid;
        background-color: blueviolet;
      }
      .input-add input {
        padding: 5px;
        height: 2rem;
        width: 200px;
      }
      .input-add button {
        height: 2.2rem;
        width: 80px;
      }
      .list {
        height: 80%;
        background-color: pink;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="container">
        <div class="input-add">
          <input placeholder="Enter Task" />
          <button>ADD</button>
        </div>
        <div class="list"></div>
      </div>
    </div>
  </body>
</html>
