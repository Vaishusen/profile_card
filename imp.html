<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zomato Style Landing Page</title>
  <link rel="stylesheet" href="imp.css">
</head>
<body>
  <div class="container">
    <div class="hero">
      <h1>Better food for<br><span>more people</span></h1>
      <p>
        For over a decade, we’ve enabled our customers to discover new tastes,<br>
        delivered right to their doorstep
      </p>
    </div>

    <div class="stats">
      <div class="stat-box">
        <h2>3,00,000+</h2>
        <p>restaurants</p>
      </div>
      <div class="stat-box">
        <h2>800+</h2>
        <p>cities</p>
      </div>
      <div class="stat-box">
        <h2>3 billion+</h2>
        <p>orders delivered</p>
      </div>
    </div>

    <!-- Decorative food images -->
    <img src="burger.png" alt="Burger" class="food burger">
    <img src="momos.png" alt="Momos" class="food momos">
    <img src="pizza.png" alt="Pizza" class="food pizza">
    <img src="tomato.png" alt="Tomato" class="food tomato1">
    <img src="tomato.png" alt="Tomato" class="food tomato2">
  </div>
</body>
</html>
